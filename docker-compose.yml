version: '3.8'

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      # Docker socket - required for Portainer to manage Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # Portainer data volume for persistent storage
      - portainer_data:/data
    ports:
      # HTTP port (optional, for HTTP access)
      - "9000:9000"
      # HTTPS port (recommended for production)
      - "9443:9443"
      # Edge agent port (optional, for Edge agent communication)
      - "8000:8000"

volumes:
  portainer_data:
    driver: local
