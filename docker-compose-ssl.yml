version: '3.8'

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      # Docker socket - required for Portainer to manage Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # Portainer data volume for persistent storage
      - portainer_data:/data
      # SSL certificates (place your cert files in ./certs directory)
      - ./certs:/certs:ro
    ports:
      # HTTPS port only (more secure)
      - "9443:9443"
      # Edge agent port (optional)
      - "8000:8000"
    command: --sslcert /certs/portainer.crt --sslkey /certs/portainer.key
    environment:
      # Optional: Set log level (DEBUG, INFO, WARN, ERROR)
      - PORTAINER_LOG_LEVEL=${PORTAINER_LOG_LEVEL:-INFO}

volumes:
  portainer_data:
    driver: local
